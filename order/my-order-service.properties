spring.application.name=order-service

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/order_processing_system_kafka_project
spring.datasource.username=root
spring.datasource.password=nabeel007dar
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.datasource.hikari.auto-commit=false

# Disable Spring Boot banner and startup information
spring.main.banner-mode=off
spring.main.log-startup-info=false

# Disable application and framework logs
logging.level.root=OFF

# Event Configuration
event.worker-id=1

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092

# Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
