spring.application.name=my-notification-service

server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/notification_processing_system_kafka_project
spring.datasource.username=root
spring.datasource.password=nabeel007dar
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=notification-service-group

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.enable-auto-commit=false

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

management.tracing.sampling.probability=1.0
management.tracing.propagation.type=W3C

management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans

logging.pattern.correlation=[${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]
logging.include-application-name=false
